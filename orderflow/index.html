<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Flow Terminal — BTC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span id="conn" class="conn off" title="conexión"></span>
      <span class="logo">ORDERFLOW<em>·TERMINAL</em></span>
      <span id="hdr-symbol" class="hsym">BTCUSDT · 1m</span>
      <span id="hdr-price" class="hprice">—</span>
      <span id="hdr-chg" class="hchg">—</span>
    </div>

    <div class="controls">
      <label>Par
        <select id="symbol">
          <option value="BTCUSDT">BTC/USDT</option>
          <option value="ETHUSDT">ETH/USDT</option>
          <option value="SOLUSDT">SOL/USDT</option>
          <option value="BNBUSDT">BNB/USDT</option>
          <option value="XRPUSDT">XRP/USDT</option>
        </select>
      </label>
      <label>TF
        <select id="interval">
          <option value="1m">1m</option>
          <option value="3m">3m</option>
          <option value="5m">5m</option>
          <option value="15m">15m</option>
        </select>
      </label>
      <label>Velas
        <select id="candles">
          <option>40</option>
          <option selected>60</option>
          <option>90</option>
          <option>120</option>
        </select>
      </label>
      <div class="seg" id="mode-seg">
        <button class="sg on" data-mode="chart">Velas</button>
        <button class="sg" data-mode="footprint">Footprint</button>
      </div>
      <div class="toggles">
        <button class="tg on" data-tg="profile">Perfil</button>
        <button class="tg on" data-tg="vwap">VWAP</button>
        <button class="tg on" data-tg="depth">L2 Depth</button>
        <button class="tg on" data-tg="bubbles">Delta</button>
      </div>
    </div>
  </header>

  <div class="body">
    <main class="stage">
      <canvas id="chart"></canvas>
      <div id="tooltip" class="tooltip hidden"></div>
    </main>

    <aside class="side">
      <div class="panel book">
        <h3>Order Book <span class="tag">L2</span>
          <span id="ob-imb" class="imb">—</span>
        </h3>
        <div id="ladder" class="ladder"><div class="sig-empty">Esperando order book…</div></div>
      </div>

      <div class="panel live">
        <h3>Vela en curso</h3>
        <div class="kv"><span>Delta</span><b id="l-delta">—</b></div>
        <div class="kv"><span>Buy / Sell</span><b id="l-bs" class="small">—</b></div>
        <div class="kv"><span>CVD</span><b id="l-cvd">—</b></div>
        <div class="kv"><span>vPOC / VAH / VAL</span><b id="l-va" class="small">—</b></div>
        <div class="kv"><span>Bid / Ask depth</span><b id="l-depth" class="small">—</b></div>
      </div>

      <div class="panel signals">
        <h3>Señales <span id="sig-count" class="badge">0</span></h3>
        <div id="sig-list" class="sig-list"></div>
      </div>
    </aside>
  </div>

  <footer class="foot">
    <span id="status">Cargando…</span>
    <span class="src">L2 order book + trades en vivo: Binance · <em>prototipo</em></span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
